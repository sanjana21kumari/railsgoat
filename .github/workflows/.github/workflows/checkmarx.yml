name: CxSAST Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cxsast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Run CxFlow Container
        run: |
          docker run --rm \
          -e CHECKMARX_SERVER=${{ secrets.CHECKMARX_SERVER }} \
          -e CHECKMARX_USERNAME=${{ secrets.CHECKMARX_USERNAME }} \
          -e CHECKMARX_PASSWORD=${{ secrets.CHECKMARX_PASSWORD }} \
          -e GITHUB_TOKEN=${{ secrets.GH_TOKEN }} \
          -e CXFLOW_GITHUB=true \
          checkmarx/cx-flow:latest
